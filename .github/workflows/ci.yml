name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API · lint · db · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: canku
          POSTGRES_USER: canku
          POSTGRES_PASSWORD: canku_dev
          TZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canku -d canku"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: canku_dev
      DATABASE_URL: postgresql+asyncpg://canku:canku_dev@127.0.0.1:5432/canku

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: 安装依赖
        working-directory: api
        run: pip install -e ".[dev]"

      - name: 代码检查
        working-directory: api
        run: ruff check app tests alembic

      # 这条是「账实一致」的持续防护，不是一次性验证。
      # DDL 走 alembic 迁移（唯一真源），种子连跑两次守住幂等：
      # 一旦有人加了不带 on conflict 的 insert，这里会立刻红。
      - name: 迁移 + 播种两次（幂等校验）
        working-directory: api
        env:
          # CI 里 DATABASE_URL 是 asyncpg，alembic 的 env.py 会转成同步 psycopg
          DATABASE_URL: postgresql+asyncpg://canku:canku_dev@127.0.0.1:5432/canku
        run: |
          set -euo pipefail
          alembic upgrade head
          cd ..
          psql -h 127.0.0.1 -U canku -d canku -v ON_ERROR_STOP=1 -q -f db/seed.sql
          psql -h 127.0.0.1 -U canku -d canku -v ON_ERROR_STOP=1 -q -f db/seed.sql

      - name: 对账必须全 OK
        run: |
          set -euo pipefail
          bad=$(psql -h 127.0.0.1 -U canku -d canku -tAq \
            -c "select count(*) from v_inventory_recon where recon_status <> 'OK';")
          echo "非 OK 记录数：$bad"
          if [ "$bad" != "0" ]; then
            psql -h 127.0.0.1 -U canku -d canku \
              -c "select * from v_inventory_recon where recon_status <> 'OK';"
            exit 1
          fi

      - name: 历史流水不可篡改
        run: |
          set -euo pipefail
          if psql -h 127.0.0.1 -U canku -d canku -q \
               -c "update stock_txn set remark = remark" 2>/dev/null; then
            echo "::error::stock_txn 的 UPDATE 竟然成功了，只追加触发器失效"
            exit 1
          fi
          echo "OK：UPDATE 被触发器拒绝"

      - name: 单元测试
        working-directory: api
        run: python -m pytest -q
