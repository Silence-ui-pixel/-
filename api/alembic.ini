# Alembic 配置。真正的连接串在 app/core/config.py，这里只留占位符，
# env.py 会在运行时用 settings.database_url 覆盖它。
# 注意：alembic 用同步 psycopg，而业务用异步 asyncpg —— 见 env.py 的说明。

[alembic]
script_location = alembic
prepend_sys_path = .

# 占位符，实际值由 env.py 注入（async URL → 同步 URL）
sqlalchemy.url = postgresql://canku:canku_dev@localhost:5432/canku

# 迁移文件名的相对路径分隔符，Windows 友好
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
